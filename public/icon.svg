<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />

  <!-- Subtle grid matrix lines in background -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.25">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="416" x2="416" y2="416" />
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Central Executive Monogram & Compass Nodes -->
  <g filter="url(#glow)">
    <!-- Main Diamond Matrix -->
    <polygon points="256,128 368,256 256,384 144,256" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linejoin="round" />
    <!-- Secondary Chevron Pivot -->
    <path d="M192,208 L256,272 L320,208" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Core Point -->
    <circle cx="256" cy="272" r="14" fill="#ffffff" />
    <circle cx="256" cy="128" r="10" fill="url(#accentGrad)" />
    <circle cx="368" cy="256" r="10" fill="url(#primaryGrad)" />
    <circle cx="144" cy="256" r="10" fill="url(#primaryGrad)" />
    <circle cx="256" cy="384" r="10" fill="url(#accentGrad)" />
  </g>

  <!-- Brand Typography Subtitle -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="6" text-anchor="middle">BIZTOOLS</text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="3" text-anchor="middle">57 FRAMEWORKS</text>
</svg>
