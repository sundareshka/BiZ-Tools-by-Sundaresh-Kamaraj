
name: Build & Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. Build frontend
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.APP_URL }}

      # 5. Verify build output
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi
          echo "Build completed successfully."
          ls -la dist

      # 6. Upload source files to the backup/source directory
      - name: Upload source to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./
          server-dir: /
          state-name: .ftp-state-source.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/dist/**
            **/.env
            **/.env.*
            !**/.env.example
            **/.github/**

      # 7. Upload production build to the website directory
      - name: Deploy production build to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /dist/
          state-name: .ftp-state-production.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
